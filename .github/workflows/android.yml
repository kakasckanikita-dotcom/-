# Сборка APK для Android в GitHub Actions.
# Запускается при каждом пуше в папку godot/ и вручную (вкладка Actions → Run workflow).
# Готовый APK лежит в артефактах запуска, а при пуше тега v* (например, v1.0)
# прикрепляется к GitHub Release — его удобно скачать прямо с телефона.
name: Android APK

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Кэш Godot и шаблонов экспорта
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-android

      - name: Скачать Godot и шаблоны экспорта
        run: |
          set -e
          V=${GODOT_VERSION}
          if [ ! -x ~/godot-bin/godot ]; then
            mkdir -p ~/godot-bin && cd ~/godot-bin
            wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
            unzip -q Godot_v${V}-stable_linux.x86_64.zip
            mv Godot_v${V}-stable_linux.x86_64 godot && rm -f *.zip
          fi
          T=~/.local/share/godot/export_templates/${V}.stable
          if [ ! -f $T/android_debug.apk ]; then
            mkdir -p $T && cd /tmp
            wget -q https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
            unzip -q Godot_v${V}-stable_export_templates.tpz 'templates/android_*' 'templates/version.txt'
            mv templates/* $T/ && rm -rf templates *.tpz
          fi
          ~/godot-bin/godot --version

      - name: Ключ подписи и настройки редактора
        run: |
          set -e
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-${GODOT_VERSION}.tres editor_settings-4.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > ~/.config/godot/$f
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME" >> ~/.config/godot/$f
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> ~/.config/godot/$f
            printf 'export/android/debug_keystore = "%s"\n' "$HOME/debug.keystore" >> ~/.config/godot/$f
            printf 'export/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' >> ~/.config/godot/$f
          done

      - name: Импорт ресурсов
        run: ~/godot-bin/godot --headless --path godot --import || true

      - name: Экспорт APK
        run: |
          set -e
          mkdir -p build
          ~/godot-bin/godot --headless --path godot --export-debug "Android" ../build/PylISvinec.apk
          test -s build/PylISvinec.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: PylISvinec-apk
          path: build/PylISvinec.apk

      - name: Релиз (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PylISvinec.apk
